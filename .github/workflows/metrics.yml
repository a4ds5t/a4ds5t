name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: lowlighter/metrics@v3.31
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: a4ds5t
          filename: github-metrics.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_isocalendar: yes
          plugin_achievements: yes
          plugin_lines: yes
          commit_message: "Update GitHub metrics"

      - name: Keep only the last 7 days of workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            -q ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" \
            | while read -r id; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" || true
              done
